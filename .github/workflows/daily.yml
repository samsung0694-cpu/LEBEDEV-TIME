name: LEBEDEV TIME — Daily Edition

"on":
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-genai

      - name: Generate daily edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Publish edition
        run: |
          git config user.name "LEBEDEV TIME Bot"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Daily edition"
          git push
