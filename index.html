
<style>
/* LEBEDEV TIME — NEWS */

.latest-news-section { margin: 35px 0; }

.latest-news-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:3px solid #111;
  padding-bottom:12px;
  margin-bottom:18px;
}

.latest-news-header h2 {
  margin:0;
  font-size:32px;
  font-weight:900;
  letter-spacing:-1px;
}

.news-edition-date {
  font-size:10px;
  color:#888;
  text-transform:uppercase;
  letter-spacing:1px;
}

.latest-news-layout {
  display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(250px,.95fr);
  gap:24px;
}

.news-list-column {
  min-width:0;
  padding-right:20px;
  border-right:1px solid #ddd;
}

.news-column-label {
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
  color:#888;
  text-transform:uppercase;
  margin-bottom:10px;
}

.news-list-item {
  padding:13px 0;
  border-bottom:1px solid #e5e5e5;
  cursor:pointer;
}

.news-list-item:hover .news-list-title,
.news-feature-card:hover .news-feature-title {
  color:#a61920;
}

.news-list-meta {
  font-size:10px;
  color:#888;
  text-transform:uppercase;
  margin-bottom:5px;
}

.news-list-title {
  font-size:15px;
  font-weight:850;
  line-height:1.3;
  margin:0 0 5px;
}

.news-list-summary {
  font-size:12px;
  line-height:1.45;
  color:#777;
  margin:0;
}

.news-feature-card {
  margin-bottom:22px;
  cursor:pointer;
}

.news-feature-image {
  display:block;
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  margin-bottom:9px;
  background:#eee;
}

.news-feature-tag {
  color:#a61920;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.news-feature-title {
  font-size:19px;
  font-weight:900;
  line-height:1.2;
  margin:6px 0;
}

.news-feature-summary {
  font-size:12px;
  line-height:1.5;
  color:#666;
}

.news-feature-bullets {
  padding-left:17px;
  font-size:12px;
  line-height:1.5;
}

.news-breaking-label {
  display:inline-block;
  background:#a61920;
  color:#fff;
  padding:4px 7px;
  font-size:9px;
  font-weight:900;
  margin-bottom:7px;
}

.news-empty {
  padding:20px 0;
  color:#888;
  font-size:13px;
}

/* NEWS MODAL */

.news-modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:99999;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.news-modal.is-open { display:flex; }

.news-modal-backdrop {
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(4px);
}

.news-modal-dialog {
  position:relative;
  z-index:2;
  width:min(760px,100%);
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  color:#171717;
  padding:27px;
  border-radius:4px;
  box-shadow:0 20px 80px rgba(0,0,0,.3);
}

.news-modal-close {
  position:sticky;
  float:right;
  top:0;
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#171717;
  color:#fff;
  font-size:25px;
  cursor:pointer;
  margin:-12px -12px 8px 10px;
}

.news-modal-category {
  color:#a61920;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}

.news-modal-title {
  font-size:30px;
  line-height:1.15;
  margin:10px 0;
}

.news-modal-image {
  width:100%;
  max-height:340px;
  aspect-ratio:16/9;
  object-fit:cover;
  margin:12px 0;
}

.news-modal-text {
  font-size:15px;
  line-height:1.7;
  color:#444;
  white-space:pre-line;
}

.news-modal-source {
  display:inline-block;
  margin-top:18px;
  padding:11px 15px;
  background:#171717;
  color:white!important;
  text-decoration:none!important;
  font-size:11px;
  font-weight:800;
}

body.news-modal-open { overflow:hidden; }

@media(max-width:700px) {
  .latest-news-layout { grid-template-columns:1fr; }
  .news-list-column {
    border-right:0;
    padding-right:0;
  }
  .news-feature-column {
    border-top:2px solid #111;
    padding-top:18px;
  }
  .news-modal-dialog {
    padding:18px;
    max-height:94vh;
  }
  .news-modal-title { font-size:24px; }
}
</style>

<section id="latest-news" class="latest-news-section">

  <div class="latest-news-header">
    <h2>НОВОСТИ</h2>
    <div class="news-edition-date" id="edition-date">
      Загрузка выпуска...
    </div>
  </div>

  <div class="latest-news-layout">

    <div class="news-list-column">
      <div class="news-column-label">Последние события</div>
      <div id="news-list">
        <div class="news-empty">Загружаем новости...</div>
      </div>
    </div>

    <div class="news-feature-column">
      <div class="news-column-label">Главное сегодня</div>
      <div id="featured-news">
        <div class="news-empty">Загружаем главные материалы...</div>
      </div>
    </div>

  </div>
</section>

<div class="news-modal" id="news-modal" aria-hidden="true">
  <div class="news-modal-backdrop"></div>
  <div class="news-modal-dialog" role="dialog" aria-modal="true">
    <button class="news-modal-close" type="button"
      aria-label="Закрыть">&times;</button>
    <div id="news-modal-content"></div>
  </div>
</div>

<script>
(() => {
  const list = document.getElementById("news-list");
  const featured = document.getElementById("featured-news");
  const date = document.getElementById("edition-date");
  const modal = document.getElementById("news-modal");
  const modalContent = document.getElementById("news-modal-content");

  if (!list || !featured || !modal || !modalContent) return;

  let articles = [];

  const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#039;"
  })[c]);

  function safeUrl(value) {
    try {
      const url = new URL(value);
      return ["https:", "http:"].includes(url.protocol) ? url.href : "";
    } catch {
      return "";
    }
  }

  const category = a => a.category || "Новости";
  const summary = a => a.summary || a.description || "";
  const fullText = a => a.content || a.fullText || a.text || summary(a);
  const image = a => safeUrl(a.image_small || a.thumbnail || a.image);
  const urgent = a => Boolean(a.urgent || a.breaking);
  const important = a => Boolean(a.featured || a.important);

  function openNews(index) {
    const a = articles[index];
    if (!a) return;

    const img = image(a);
    const source = safeUrl(a.url);

    modalContent.innerHTML = `
      <div class="news-modal-category">${esc(category(a))}</div>
      <h2 class="news-modal-title">${esc(a.title)}</h2>
      ${img ? `<img class="news-modal-image"
        src="${esc(img)}" alt="${esc(a.title)}"
        loading="eager" decoding="async">` : ""}
      <div class="news-modal-text">${esc(fullText(a))}</div>
      ${a.source ? `<p style="color:#888;font-size:12px">
        Источник: ${esc(a.source)}</p>` : ""}
      ${source ? `<a class="news-modal-source"
        href="${esc(source)}" target="_blank"
        rel="noopener noreferrer">
        ПЕРЕЙТИ К ПЕРВОИСТОЧНИКУ →
      </a>` : ""}
    `;

    modal.classList.add("is-open");
    modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("news-modal-open");
  }

  function closeNews() {
    modal.classList.remove("is-open");
    modal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("news-modal-open");
  }

  modal.querySelector(".news-modal-close")
    .addEventListener("click", closeNews);

  modal.querySelector(".news-modal-backdrop")
    .addEventListener("click", closeNews);

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeNews();
  });

  function featureCard(a, index, label) {
    const img = image(a);
    const bullets = Array.isArray(a.bullets) ? a.bullets : [];

    return `
      <article class="news-feature-card" data-news="${index}">
        ${urgent(a) ? '<div class="news-breaking-label">СРОЧНО</div>' : ""}
        ${img ? `<img class="news-feature-image"
          src="${esc(img)}" alt="${esc(a.title)}"
          loading="lazy" decoding="async">` : ""}
        <div class="news-feature-tag">${esc(label)}</div>
        <h3 class="news-feature-title">${esc(a.title)}</h3>
        <p class="news-feature-summary">${esc(summary(a))}</p>
        ${bullets.length ? `<ul class="news-feature-bullets">
          ${bullets.slice(0,4).map(x => `<li>${esc(x)}</li>`).join("")}
        </ul>` : ""}
      </article>
    `;
  }

  function listItem(a, index) {
    return `
      <article class="news-list-item" data-news="${index}"
        tabindex="0" role="button">
        <div class="news-list-meta">
          ${urgent(a) ? '<b style="color:#a61920">СРОЧНО · </b>' : ""}
          ${esc(category(a))}
        </div>
        <h3 class="news-list-title">${esc(a.title)}</h3>
        <p class="news-list-summary">${esc(summary(a))}</p>
      </article>
    `;
  }

  function render(data) {
    articles = Array.isArray(data.articles) ? data.articles : [];

    date.textContent = data.date
      ? "Выпуск от " + data.date
      : "Последние материалы";

    if (!articles.length) {
      list.innerHTML = '<div class="news-empty">Новостей пока нет.</div>';
      featured.innerHTML = "";
      return;
    }

    const selected = [];
    const used = new Set();

    function add(a, label) {
      if (!a) return;
      const i = articles.indexOf(a);
      if (i < 0 || used.has(i)) return;
      selected.push({ article:a, index:i, label });
      used.add(i);
    }

    const urgentArticle = articles.find(urgent);
    const importantArticle = articles.find(a => important(a) && a !== urgentArticle);
    const kaliningradArticle = articles.find(a =>
      /калининград/i.test((a.category || "") + " " + (a.title || "")) &&
      a !== urgentArticle && a !== importantArticle
    );

    add(urgentArticle, "Экстренно");
    add(importantArticle, "Главное");
    add(kaliningradArticle, "Калининград");

    if (!selected.length) add(articles[0], "Главное сегодня");

    featured.innerHTML = selected.map(x =>
      featureCard(x.article, x.index, x.label)
    ).join("");

    const remaining = articles
      .map((a,i) => ({a,i}))
      .filter(x => !used.has(x.i));

    list.innerHTML = remaining.length
      ? remaining.map(x => listItem(x.a,x.i)).join("")
      : '<div class="news-empty">Все материалы представлены справа.</div>';
  }

  document.addEventListener("click", e => {
    const item = e.target.closest("[data-news]");
    if (item) openNews(Number(item.dataset.news));
  });

  document.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") &&
        e.target.matches("[data-news]")) {
      e.preventDefault();
      openNews(Number(e.target.dataset.news));
    }
  });

  async function loadNews() {
    try {
      const response = await fetch("data/edition.json?t=" + Date.now());
      if (!response.ok) throw new Error("Ошибка загрузки выпуска");
      render(await response.json());
    } catch (error) {
      console.error("LEBEDEV TIME:", error);
      list.innerHTML =
        '<div class="news-empty">Не удалось загрузить новости.</div>';
      featured.innerHTML = "";
    }
  }

  loadNews();
})();
</script>
